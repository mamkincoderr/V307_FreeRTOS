# Процедуры OpenOCD для V307_FreeRTOS (по образцу tools/h417.cfg из H417_FreeRTOS). Подключается после wch-riscv.cfg.
# Автор: Дмитрий (GitHub: mamkincoderr), Telegram: https://t.me/oDeXteRo
#
# Одно ядро V4F (GDB 3333). Флеш больше окна 128 КБ без ожидания: перед записью — wch_riscv unfreeze.

# Корень проекта — по расположению этого файла (tools/v307.cfg): путь к образу не зашит в конфигурации MRS.
set ::v307_root [file dirname [file dirname [string map {\\ /} [info script]]]]
set ::v307_image "$::v307_root/obj/V307_FreeRTOS.hex"

# Аппаратные точки останова переживают сброс чипа (так было на H417): забытая после убитой сессии GDB
# останавливает ядро на каждом пуске. Снимаем все четыре; если ядро таких регистров не отдаёт — пропускаем.
proc v307_clear_bp {} {
    halt
    for {set i 0} {$i < 4} {incr i} {
        catch {
            reg tselect $i
            reg tdata1 0
        }
    }
}

# Записать образ, проверить и пустить чип сбросом.
proc v307_flash {file} {
    v307_clear_bp
    wch_riscv unfreeze
    program $file verify
    wlink_reset_resume
}

proc v307_reset {} {
    v307_clear_bp
    wlink_reset_resume
}

# Старт отладки из MRS 1.92 (.launch, otherRunCommands): записать образ, аппаратная точка на main, reset run.
# Первый пуск после смены режима памяти чип сбрасывает сам (MemConfig) — точка переживает сброс, ядро встаёт на main.
# После останова OpenOCD про точку не помнит, а триггер в ядре остаётся — снимаем регистрами (v307_clear_bp).
proc v307_debug_start {main} {
    v307_clear_bp
    wch_riscv unfreeze
    program $::v307_image verify
    bp $main 2 hw
    reset run
    sleep 800
    v307_clear_bp
    echo "V307: core [wch_riscv.cpu.0 curstate], pc [reg pc]"
}
