<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Подключение терморезистора к входу АЦП CH32V307</title>
  <style>
    :root { color-scheme: light; background: #ffffff; color: #000000; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #ffffff; }
    main { max-width: 1120px; margin: 0 auto; padding: 0; }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
<main>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 680" role="img" aria-labelledby="ntc-divider-title ntc-divider-desc">
  <title id="ntc-divider-title">Подключение терморезистора к входу АЦП CH32V307</title>
  <desc id="ntc-divider-desc">Терморезистор RK1 33 кОм включён от цепи +3,3 В к входу АЦП, резистор R1 33 кОм соединяет вход с общим проводом.</desc>
  <rect width="1080" height="680" fill="#ffffff"/>
  <g fill="none" stroke="#000000" stroke-width="3" stroke-linecap="square">
    <!-- Цепь +3,3 В -->
    <circle cx="300" cy="150" r="6"/>
    <path d="M300 156V200"/>
    <!-- RK1: терморезистор с отрицательным ТКС, ГОСТ 2.728 -->
    <rect x="280" y="200" width="40" height="100"/>
    <path d="M252 318H268L336 186" stroke-width="2" stroke-linecap="butt"/>
    <path d="M300 300V380"/>
    <!-- Узел и линия к входу АЦП -->
    <path d="M300 340H640"/>
    <circle cx="646" cy="340" r="6"/>
    <!-- R1: резистор постоянный, ГОСТ 2.728 -->
    <rect x="280" y="380" width="40" height="100"/>
    <path d="M300 480V540"/>
    <!-- Заземление, ГОСТ 2.721 -->
    <path d="M266 540H334M280 554H320M292 568H308"/>
  </g>
  <circle cx="300" cy="340" r="6" fill="#000000"/>

  <g fill="#000000" font-family="'GOST type B', 'GOST Type BU', ISOCPEUR, 'Arial', sans-serif" font-style="italic">
    <text x="48" y="62" font-size="28">Подключение терморезистора к входу АЦП</text>
    <text x="48" y="92" font-size="17">Один канал; такой же делитель на каждом из 12 входов</text>

    <text x="318" y="144" font-size="20">+3,3 В</text>
    <text x="344" y="186" font-size="20">−t°</text>
    <text x="262" y="244" font-size="20" text-anchor="end">RK1</text>
    <text x="262" y="270" font-size="17" text-anchor="end">33 к</text>
    <text x="262" y="424" font-size="20" text-anchor="end">R1</text>
    <text x="262" y="450" font-size="17" text-anchor="end">33 к</text>

    <text x="340" y="328" font-size="17">К входу АЦП DD1</text>
    <text x="340" y="366" font-size="17">PA0…PA5, PC0…PC5</text>
  </g>

  <!-- Перечень элементов, ГОСТ 2.701 (упрощённо) -->
  <g fill="none" stroke="#000000" stroke-width="2">
    <rect x="690" y="150" width="350" height="190"/>
    <path d="M690 190H1040M690 270H1040M760 150V340M990 150V340"/>
  </g>
  <g fill="#000000" font-family="'GOST type B', 'GOST Type BU', ISOCPEUR, 'Arial', sans-serif" font-style="italic" font-size="15">
    <text x="865" y="138" font-size="17" text-anchor="middle">Перечень элементов</text>
    <text x="725" y="167" text-anchor="middle">Поз.</text>
    <text x="725" y="183" text-anchor="middle">обозн.</text>
    <text x="875" y="176" text-anchor="middle">Наименование</text>
    <text x="1015" y="176" text-anchor="middle">Кол.</text>
    <text x="725" y="214" text-anchor="middle">RK1</text>
    <text x="770" y="214">Терморезистор</text>
    <text x="770" y="236">NCP18WB333J03RB, 33 кОм,</text>
    <text x="770" y="258">B25/85 = 4108 K</text>
    <text x="1015" y="214" text-anchor="middle">1</text>
    <text x="725" y="294" text-anchor="middle">R1</text>
    <text x="770" y="294">Резистор 33 кОм</text>
    <text x="1015" y="294" text-anchor="middle">1</text>
  </g>

  <g fill="#000000" font-family="'GOST type B', 'GOST Type BU', ISOCPEUR, 'Arial', sans-serif" font-style="italic" font-size="16">
    <text x="48" y="616">1. Uвх / VDDA = R1 / (R1 + RK1); при 25 °C — около 0,5.</text>
    <text x="48" y="640">2. Делитель питать от той же цепи +3,3 В, что и VDDA микроконтроллера.</text>
    <text x="48" y="664">3. Рекомендуется конденсатор 10…100 нФ между входом АЦП и общим проводом рядом с платой.</text>
  </g>
</svg>
</main>
</body>
</html>
